<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="60" viewBox="0 0 720 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Simple hover-ish effect: scale via pointer-events */
    a:hover image { filter: brightness(1.1); }
  </style>

  <!-- Discord -->
  <a xlink:href="https://discordapp.com/users/123456789012345678" target="_blank" rel="noopener noreferrer">
    <image
      x="0" y="0" width="170" height="35"
      xlink:href="https://img.shields.io/static/v1?message=Discord&logo=discord&label=&color=7289DA&logoColor=white&labelColor=&style=for-the-badge"/>
  </a>

  <!-- Gmail -->
  <a xlink:href="mailto:your.email@gmail.com" target="_blank" rel="noopener noreferrer">
    <image
      x="185" y="0" width="150" height="35"
      xlink:href="https://img.shields.io/static/v1?message=Gmail&logo=gmail&label=&color=D14836&logoColor=white&labelColor=&style=for-the-badge"/>
  </a>

  <!-- LinkedIn -->
  <a xlink:href="https://www.linkedin.com/in/your-linkedin/" target="_blank" rel="noopener noreferrer">
    <image
      x="350" y="0" width="170" height="35"
      xlink:href="https://img.shields.io/static/v1?message=LinkedIn&logo=linkedin&label=&color=0077B5&logoColor=white&labelColor=&style=for-the-badge"/>
  </a>

  <!-- Twitter/X -->
  <a xlink:href="https://twitter.com/your_twitter" target="_blank" rel="noopener noreferrer">
    <image
      x="535" y="0" width="170" height="35"
      xlink:href="https://img.shields.io/static/v1?message=Twitter&logo=twitter&label=&color=1DA1F2&logoColor=white&labelColor=&style=for-the-badge"/>
  </a>
</svg>
