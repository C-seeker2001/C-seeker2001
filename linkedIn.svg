<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="500px" height="300px">
  <defs>
    <style type="text/css">
      @keyframes dvd-bounce-svg {
        0% {
          transform: translate(0px, 0px);
          filter: hue-rotate(0deg);
        }
        25% {
          /* Change 440px to 380px and 240px to 180px */
          transform: translate(380px, 180px);
          filter: hue-rotate(90deg);
        }
        50% {
          /* Change 240px to 180px */
          transform: translate(0px, 180px);
          filter: hue-rotate(180deg);
        }
        75% {
          /* Change 440px to 380px */
          transform: translate(380px, 0px);
          filter: hue-rotate(270deg);
        }
        100% {
          transform: translate(0px, 0px);
          filter: hue-rotate(360deg);
        }
      }

      #linkedin-logo {
        /* Apply the animation, make it last 10 seconds, and loop forever */
        animation: dvd-bounce-svg 10s linear infinite;
      }
    </style>
  </defs>

  <!-- The group containing the logo path is what gets animated -->
  <g id="linkedin-logo" transform="scale(2)">
    <path
      fill="#0077b7"
      d="M 51.833,2.997 H 7.854 c -2.682,0 -4.857,2.175 -4.857,4.857 V 51.834 c 0,2.683 2.175,4.857 4.857,4.857 H 51.834 c 2.683,0 4.857,-2.174 4.857,-4.857 V 7.854 c 0,-2.682 -2.174,-4.857 -4.857,-4.857 z M 19.612,47.493 c 0,0.78 -0.633,1.413 -1.413,1.413 H 12.182 c -0.781,0 -1.414,-0.633 -1.414,-1.413 V 24.137 c 0,-0.78 0.633,-1.414 1.414,-1.414 h 6.017 c 0.78,0 1.413,0.634 1.413,1.414 z M 15.190,20.346 c -3.156,0 -5.716,-2.559 -5.716,-5.716 0,-3.156 2.560,-5.716 5.716,-5.716 3.157,0 5.716,2.560 5.716,5.716 0,3.157 -2.559,5.716 -5.716,5.716 z M 51.056,47.614 c 0,0.718 -0.582,1.300 -1.300,1.300 H 43.296 c -0.718,0 -1.300,-0.582 -1.300,-1.300 V 35.773 c 0,-1.764 0.518,-7.734 -4.612,-7.734 -3.979,0 -4.786,4.084 -4.948,5.919 v 13.656 c 0,0.718 -0.582,1.300 -1.300,1.300 h -6.238 c -0.718,0 -1.300,-0.582 -1.300,-1.300 V 24.023 c 0,-0.718 0.582,-1.300 1.300,-1.300 h 6.245 c 0.718,0 1.300,0.582 1.300,1.300 v 2.200 c 1.476,-2.214 3.668,-3.923 8.337,-3.923 10.34,0 10.276,9.66 10.276,14.965 z" />
  </g>
</svg>
