<svg
   height="500"
   width="500"
   version="1.1"
   id="Layer_1"
   viewBox="0 0 320 320"
   xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Animation for the icon shaking */
    @keyframes shake {
      0%, 25%, 100% {
        transform: rotate(0);
      }
      5% {
        transform: rotate(7deg);
      }
      10% {
        transform: rotate(-7deg);
      }
      15% {
        transform: rotate(7deg);
      }
      20% {
        transform: rotate(-7deg);
      }
    }

    /* Animation for the notification dot appearing and disappearing */
    @keyframes dot-animation {
      0%, 25% { /* Stays hidden during the shake */
        opacity: 0;
        transform: scale(0);
      }
      37.5%, 87.5% { /* Appears after the shake and stays visible */
        opacity: 1;
        transform: scale(1);
      }
      100% { /* Fades out before the next cycle */
        opacity: 0;
        transform: scale(0);
      }
    }

    /* Applying the animations */
    #anim-wrapper {
      animation: shake 4s infinite linear;
      transform-origin: 160px 160px; /* Set rotation origin to the center of the icon */
    }

    #notification-dot {
      animation: dot-animation 4s infinite ease-in-out;
      transform-origin: 245px 95px; /* Set scale origin to the center of the dot */
    }
  </style>

  <g id="anim-wrapper">
