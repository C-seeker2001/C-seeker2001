<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 80 50"
   width="800"
   height="500"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <style>
      /* Keyframes for hitting all four corners in a predictable sequence */
      @keyframes cornerBounce {
        0% {
          transform: translate(0px, 0px); /* Top-Left */
        }
        25% {
          transform: translate(60px, 30.5px); /* Bottom-Right */
        }
        50% {
          transform: translate(0px, 30.5px); /* Bottom-Left */
        }
        75% {
          transform: translate(60px, 0px); /* Top-Right */
        }
        100% {
          transform: translate(0px, 0px); /* Return to Top-Left */
        }
      }

      /* Keyframes for color cycling */
      @keyframes colorChange {
        0%   { fill: red; }
        25%  { fill: blue; }
        50%  { fill: green; }
        75%  { fill: purple; }
        100% { fill: red; }
      }

      #logo-group {
        /* Apply the single, combined movement animation */
        animation: cornerBounce 12s linear infinite;
      }

      #logo-path {
        /* Apply the color animation */
        animation: colorChange 8s ease-in-out infinite alternate;
        stroke-width:0.434782;
      }

      #thank-you-text {
        /* Text styling */
        font-family: Arial, sans-serif;
        font-size: 5px; /* Adjusted to fit the viewBox */
        font-weight: bold;
        text-anchor: middle; /* Center text horizontally */
        dominant-baseline: middle; /* Center text vertically */
        
        /* Apply the color animation to the text */
        animation: colorChange 10s ease-in-out infinite alternate; /* Slightly different duration for variety */
      }
    </style>
  </defs>
  
